version: "2"
linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gocritic
    - misspell
    - prealloc
    - unconvert
  settings:
    gocritic:
      disabled-checks: [ifElseChain, singleCaseSwitch, appendAssign]
  exclusions:
    rules:
      - path: _test\.go
        linters: [errcheck, prealloc]
      # coder/websocket.Dial returns the handshake *http.Response, whose body the library
      # manages itself ("You never need to close resp.Body yourself" - see Dial's godoc).
      - linters: [bodyclose]
        source: websocket\.Dial\(
